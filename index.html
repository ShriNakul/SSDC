<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>SSDC</title>

    <!-- React -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <style>
      body {
        margin: 0;
        padding: 0;
        background: #ffffff;
        overflow: hidden;
      }

      .appContainer {
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100vh;
        background: #fff;
        color: #000;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        position: relative;
        padding: 2rem;
        box-sizing: border-box;
      }

      .topRightInfo {
        position: absolute;
        top: 2rem;
        right: 2rem;
        text-align: right;
      }

      .title {
        margin: 0;
        font-size: 1.1rem;
        font-weight: 500;
      }

      .subtitle {
        margin: 0.25rem 0 0;
        font-size: 0.85rem;
        color: #888;
      }

      .workspace {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 2rem;
        max-width: 1000px;
        width: 100%;
        margin: auto;
      }

      .actionBtn {
        display: flex;
        align-items: center;
        gap: 1rem;
        background: none;
        border: none;
        cursor: pointer;
        padding: 1rem;
        transition: 0.2s;
      }

      .actionBtn:disabled {
        opacity: 0.3;
        cursor: not-allowed;
      }

      .shieldWrapper {
        width: 60px;
        height: 70px;
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .iconShield {
        position: absolute;
        width: 100%;
        height: 100%;
        fill: #000;
      }

      .shieldText {
        color: white;
        z-index: 2;
        font-weight: 600;
      }

      .iconTrash {
        width: 60px;
        height: 60px;
        fill: #000;
      }

      .arrowLeft,
      .arrowRight {
        width: 80px;
        height: 80px;
        fill: #888;
      }

      .previewCard {
        width: 450px;
        height: 560px;
        background: #4a4a4a;
        border-radius: 20px;
        padding: 2rem;
        box-sizing: border-box;
        color: white;

        display: flex;
        flex-direction: column;
        justify-content: space-between;

        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      }

      .previewContent {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        text-align: center;
      }

      .emptyState {
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .selectFolderBtn {
        background: none;
        border: none;
        color: white;
        font-size: 1.1rem;
        cursor: pointer;
        text-decoration: underline;
      }

      .fileName {
        font-size: 1.2rem;
        font-weight: 700;
        text-align: center;
        word-break: break-all;
      }

      .mediaPreview {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
        border-radius: 8px;
      }

      .audioWrapper {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1rem;
        width: 100%;
      }

      .audioIcon {
        width: 80px;
        height: 80px;
        fill: white;
        opacity: 0.6;
      }

      .audioPlayer {
        width: 100%;
      }

      .codePreview {
        width: 100%;
        height: 100%;
        background: #1e1e1e;
        color: #ddd;
        padding: 1rem;
        overflow: auto;
        text-align: left;
        font-family: monospace;
        border-radius: 8px;
        box-sizing: border-box;
      }

      .genericFileIcon {
        width: 100px;
        height: 100px;
        fill: white;
        opacity: 0.7;
      }

      .bottomRightVersion {
        position: absolute;
        bottom: 1.5rem;
        right: 2rem;
        color: #888;
      }

      .viewTrashBtn {
        position: absolute;
        bottom: 1.5rem;
        left: 2rem;

        background: #000;
        color: white;

        border: none;
        border-radius: 8px;

        padding: 10px 20px;

        cursor: pointer;
        font-weight: bold;
      }

      @media (max-width: 800px) {
        .workspace {
          flex-direction: column;
        }

        .previewCard {
          width: 90%;
        }
      }
    </style>
  </head>

  <body>
    <div id="root"></div>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel" src="./renderer.js"></script>
  </body>
</html>
